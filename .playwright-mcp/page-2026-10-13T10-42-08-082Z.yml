          - generic [ref=e423]:
            - heading "Important" [level=3] [ref=e425]
            - generic [ref=e426]:
              - paragraph [ref=e427]: You must answer all questions, which we ask, honestly and with reasonable care. Failure to do so may result in the policy not providing the cover that is needed, a claim not being paid or the policy being declared void or cancelled. The answers given are used to determine acceptance of your application for Group Personal Accident and Travel Insurance, calculate the premium, the exceptions, terms, and conditions, on which the policy will be based.
              - heading "Aviva Data Protection - Privacy Notice" [level=4] [ref=e428]
              - paragraph [ref=e429]: We collect and use personal information about you so that we can provide you with an insurance policy that suits your insurance needs. This notice explains the most important aspects of how we use your information and what rights you have in relation to your personal information but you can get more information about the terms we use and view our full Privacy Policy at our Privacy page on www.aviva.ie, request a copy by writing to us at Data Protection Officer, Aviva Insurance Ireland DAC, Building 12, Cherrywood Business Park, Loughlinstown, Dublin D18 W2P5 or call us at 01 8988000.
              - paragraph [ref=e430]: The data controller responsible for this personal information is Aviva Insurance Ireland DAC (“we” “us” “our”) as the insurer of the product and can be contacted as above. Additional controllers include your intermediary/broker who is responsible for the sale and distribution of the product and any applicable reinsurers.
              - heading "1. Personal information We collect" [level=4] [ref=e431]
              - paragraph [ref=e432]: "Your data: The personal information we collect and use may include your name, address, telephone number and/or email address, date of birth or age, occupation, marital status, other products you have purchased from us, claims history, employer/employee details (where necessary), business professional history and details, bank account details or payment card details, unspent criminal convictions. We may carry out financial checks and credit searches in relation to your business."
              - paragraph [ref=e433]: "Other people's data: As well as collecting personal information about you, we may also use personal information about other people, for example individuals you wish to insure on a policy."
              - paragraph [ref=e434]: "Note: If you are providing information about another person, we expect you to show them this data protection notice and ensure that they have given you permission to provide this information to us so that we can provide a quote. If they have any concerns, please ask them to contact us in one of the ways described in the “Contacting Us” section."
              - paragraph [ref=e435]: "Claims data: If a claim is made, we may also collect personal information about the claim from you and any relevant third parties."
              - paragraph [ref=e436]: "Note: You don't have to provide us with any personal information, but if you don't provide the information we need we may not be able to proceed with your application or any claim you make. We will let you know what information is required to proceed with your application or any claim you make."
              - paragraph [ref=e437]: "Health data: We may need to ask for details relating to your health data or the health data of somebody else covered under your policy."
              - paragraph [ref=e438]: We recognise that information about health data is particularly sensitive information. We will only collect and use such data for the purposes of providing quotes and underwriting, managing reinsurance arrangements, processing any claims you may have, fraud investigation and handling any complaints you may have. Irish Data Protection law allows us to use health data in connection with your insurance policy.
              - paragraph [ref=e439]: We may also need to use your health data for the purposes of establishing, exercising or defending legal rights, including in connection with advice, claims, or proceedings, and where authorised by law.
              - heading "2. How we collect your personal information" [level=4] [ref=e440]
              - paragraph [ref=e441]: "We may collect personal information about you from:"
              - list [ref=e442]:
                - listitem [ref=e443]: You;
                - listitem [ref=e444]: other people connected to the policy;
                - listitem [ref=e445]: your broker or intermediary;
                - listitem [ref=e446]: your employer, if relevant to your insurance cover;
                - listitem [ref=e447]: publicly available information including social media websites and online content, newspaper articles, TV, radio and other media content, court judgements;
                - listitem [ref=e448]: insurance industry databases and other commercial databases such as Experian – we have provided more detail below on the industry databases from which we collect and share information;
                - listitem [ref=e449]: other records within the Aviva Group if you have or have had other insurance policies with or sought a quote from another Aviva company or third-party claims;
                - listitem [ref=e450]: third parties involved in a claim (including a claimant, private investigators engaged by us, witnesses, solicitors and independent experts);
                - listitem [ref=e451]: when you visit one of the Aviva Group websites; and
                - listitem [ref=e452]: Insurance Ireland (insurance industry's representative body) operate a confidential phone line (Insurance Confidential) for individuals to report suspect fraud.
                - listitem [ref=e453]: Information received by Insurance Ireland is shared with relevant insurers.
              - heading "3. How We use personal information" [level=4] [ref=e454]
              - paragraph [ref=e455]: "We may collect and use personal information for the purposes, and on the legal basis, set out below:"
              - list [ref=e456]:
                - listitem [ref=e457]: To provide a quote, including making a decision as to whether we can provide you with cover and at what price; to take steps at your request prior to entering into a policy.
                - listitem [ref=e458]: To verify your identity; to perform the policy; to comply with our legal obligations.
                - listitem [ref=e459]: To provide you with insurance cover and administer your insurance policy, including dealing with any queries or changes, payments, renewals and processing a cancellation of your policy; to perform the policy.
                - listitem [ref=e460]: To validate, investigate and/or process any claims you or another person makes in relation to your insurance policy; to perform the policy; to comply with our legal obligations.
                - listitem [ref=e461]: To maintain arrangements we have with reinsurers; for our legitimate interests in managing our business.
                - listitem [ref=e462]: For management information purposes including portfolio assessment, risk assessment, performance reporting and management reporting.
                - listitem [ref=e463]: For a proposed portfolio transfer, reorganisation, transfer, disposal or other transaction relating to our business.
                - listitem [ref=e464]: To detect and prevent fraud; for our legitimate interests in managing our business; to perform your policy; to comply with our legal obligations.
                - listitem [ref=e465]: To comply with laws and regulations; to comply with our legal obligations.
              - heading "4A. How we share your personal information with others" [level=4] [ref=e466]
              - paragraph [ref=e467]: "We may share your personal information:"
              - list [ref=e468]:
                - listitem [ref=e469]: with the Aviva group, our agents and third parties who provide services to us, your intermediary and other insurers (either directly or via those acting for the insurer such as loss adjusters or investigators) to help us administer our products and services;
                - listitem [ref=e470]: with professional bodies, regulatory bodies and law enforcement bodies, including the Gardaí, e.g. if we are required to do so to comply with a relevant legal or regulatory obligation; and
                - listitem [ref=e471]: with reinsurers who provide reinsurance services to Aviva. Reinsurers will use your data to decide whether to provide reinsurance cover, assess and deal with reinsurance claims and to meet legal obligations. They will keep your data for the period necessary for these purposes and may need to disclose it to other companies within their group, their agents and third party service providers, law enforcement and regulatory bodies.
                - listitem [ref=e472]: With Third Party claimants or their legal representatives while dealing with the administration of a claim.
              - paragraph [ref=e473]: Some of the organisations we share information with are located outside of the European Economic Area, including India. These locations may not provide an adequate level of protection. We'll always take steps to ensure that any such transfer of information is carefully managed to protect your privacy rights. For more information on this please see our Privacy Policy or contact us in one of the ways described below.
              - heading "4B. How we share your personal information with others for fraud prevention" [level=4] [ref=e474]
              - paragraph [ref=e475]: "The data you provide will be used by us and shared with other insurers as well as certain statutory and other authorised bodies for anti-fraud purposes including:"
              - list [ref=e476]:
                - listitem [ref=e477]: sharing information about you with other public bodies including the Department of Finance, regulatory bodies (which include the Central Bank of Ireland, Financial Services Ombudsman, Data Protection Commissioner), professional bodies, fraud prevention agencies and the Gardaí;
                - listitem [ref=e478]: private investigators, tracing debtors or beneficiaries, recovering debt, managing your accounts and/or insurance policies; and
                - listitem [ref=e479]: undertaking fraud searches on publicly available information as outlined above and checking the Insurance Industry claims database, Insurance Link. For more information on Insurance Link please go to www.inslink.ie. This database helps insurers check claims information and prevent fraudulent claims;
                - listitem [ref=e480]: Other Aviva entities.
              - heading "5. Financial checks and credit searches" [level=4] [ref=e481]
              - paragraph [ref=e482]: We may carry out financial checks and credit searches against the policyholder through third parties who provide us with credit information.
              - heading "6. Using Personal Information to Create Profiles and make Automated Decisions" [level=4] [ref=e483]
              - paragraph [ref=e484]: If you are applying for insurance, we may use tools to create profiles about you and, in some cases, use processes that apply these profiles to make fully automated decisions that may affect the services we provide to you. In the context of arranging an insurance policy, these tools are often used to help assess individual risk or the impact your information might have on the cumulative risk of a group and calculate insurance premiums or to make a decision about whether to extend or renew cover. If you are making a claim, we may use profiling or other forms of automated processing to assess the probability that your claim may be fraudulent or suspect in some way. Where sensitive personal information is relevant to the profiling, such as past convictions, your sensitive personal information may also be used in the profiling models. Please note, you have certain rights in respect of automated decision making where that decision has significant effects on you, including where it produces a legal effect on you. Full details of your rights can be found in the “Your Rights” section of the Privacy Policy.
              - heading "7. Online information" [level=4] [ref=e485]
              - paragraph [ref=e486]: When you visit one of the Aviva Group websites, we may record information about your computer or mobile device, including hardware and software used, general location, when and how you interact with our websites. This information is used to note your interest in our websites and improve customer journeys. You have the option to select and manage your preferences when you visit one of these websites.
              - heading "8. How long we keep your personal information for" [level=4] [ref=e487]
              - paragraph [ref=e488]: Information submitted for a quotation may be retained by us for a period of up to 15 months from the date of the quotation. Where you purchase a product from us, information will be held for the duration of your insurance cover and for at least six years after our relationship ends in order to comply with applicable laws and regulations and for use in connection with any claims. For more information on our data retention policies please see our Privacy Policy or contact us in one of the ways described below in the “Contacting us” section.
              - heading "9. Your rights in relation to Your personal information" [level=4] [ref=e489]
              - paragraph [ref=e490]: "You have various rights in relation to your personal information, including:"
              - list [ref=e491]:
                - listitem [ref=e492]: the right to request access to your personal information;
                - listitem [ref=e493]: correct any mistakes on our records;
                - listitem [ref=e494]: erase or restrict records where they are no longer required;
                - listitem [ref=e495]: ask not to be subject to automated decision making if the decision produces legal or other significant effects on you;
                - listitem [ref=e496]: to move certain data to other providers;
                - listitem [ref=e497]: where we rely on your consent as our legal basis for use of your personal data you have a right to withdraw your consent to such use.
              - paragraph [ref=e498]: "Note: you have the right to object to use of personal information based on legitimate business interests. If you do object, we will have an opportunity to demonstrate that there are compelling legitimate grounds which override your rights and freedoms or that processing is necessary for the establishment, exercise or defence of legal claims. Please note that any successful objection may prevent us assessing future claims and/or the policy may be cancelled."
              - paragraph [ref=e499]: For more details in relation to your rights, including how to exercise them, please see our full Privacy Policy or contact us in one of the ways described below.
              - heading "10. Contacting Us" [level=4] [ref=e500]
              - paragraph [ref=e501]: If you have any questions about how we use personal information, or if you want to exercise your rights stated above, please contact our Data Protection team by either emailing them at DPO@aviva.com, writing to the Data Protection Officer, Aviva Insurance Ireland DAC, Building 12, Cherrywood Business Park, Loughlinstown, Dublin 18 W2P5 or call us at (01) 8988000.
              - paragraph [ref=e502]: If you have a complaint or concern about how we use your personal information, please contact us in the first instance and we will attempt to resolve the issue as soon as possible. You also have the right to lodge a complaint with the Office of the Data Protection Commissioner at any time, by writing to them at 21 Fitzwilliam Square South, Dublin 2, D02 RD28, Ireland.
